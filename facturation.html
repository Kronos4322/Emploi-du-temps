<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facturation — Emploi du temps</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Planning">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
  <style>
    .tag-filter-wrap { display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);min-height:38px }
    .tag-filter-btn { padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:0.8rem;transition:.15s }
    .tag-filter-btn.active { background:var(--primary);color:#fff;border-color:var(--primary) }
    .tag-filter-label { font-size:0.78rem;color:var(--text-muted);white-space:nowrap }
    details.fact-section > summary { cursor:pointer;padding:10px 0;font-weight:700;font-size:0.95rem;list-style:none;display:flex;align-items:center;justify-content:space-between;color:var(--text);border-bottom:1px solid var(--border);margin-bottom:12px }
    details.fact-section > summary::after { content:'▲';font-size:0.7rem;color:var(--text-muted) }
    details.fact-section:not([open]) > summary::after { content:'▼' }
    details.fact-section { margin-bottom:20px }
  </style>
</head>
<body>
  <aside id="sidebar"></aside>
  <div id="app-main">
    <main id="main-content">

      <div class="page-header">
        <h1 class="page-title">Facturation</h1>
        <div class="page-actions">
          <button class="btn btn-ghost" id="btn-export-csv">⬇ Export CSV</button>
        </div>
      </div>

      <!-- Filtres -->
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">
        <div class="filters-bar" style="flex-wrap:wrap;gap:8px">
          <select id="filter-pole"  class="form-input filter-select"></select>
          <select id="filter-month" class="form-input filter-select"></select>
        </div>

        <!-- Écoles (tags cliquables) -->
        <div class="tag-filter-wrap">
          <span class="tag-filter-label">Écoles :</span>
          <button class="tag-filter-btn active" id="btn-school-all" onclick="window._toggleAllSchools()">Toutes</button>
          <button class="tag-filter-btn" id="btn-school-none" onclick="window._toggleNoneSchools()">Aucune</button>
          <span id="school-tags"></span>
        </div>

        <!-- Prestataires (tags cliquables) -->
        <div class="tag-filter-wrap">
          <span class="tag-filter-label">Prestataires :</span>
          <button class="tag-filter-btn active" id="btn-prov-all" onclick="window._toggleAllProvs()">Tous</button>
          <button class="tag-filter-btn" id="btn-prov-none" onclick="window._toggleNoneProvs()">Aucun</button>
          <span id="provider-tags"></span>
        </div>
      </div>

      <!-- KPIs -->
      <div id="billing-kpis" class="kpi-grid"></div>

      <!-- Prestataires -->
      <details class="fact-section" open id="section-provs">
        <summary>Prestataires (personnes physiques)</summary>
        <div id="billing-by-provider-inner"></div>
      </details>

      <!-- Écoles -->
      <details class="fact-section" open id="section-schools">
        <summary>Écoles / Clients (personnes morales)</summary>
        <div id="billing-by-school-inner"></div>
      </details>

      <!-- Détail -->
      <details class="fact-section" id="section-detail">
        <summary id="detail-summary">Détail des missions</summary>
        <div id="billing-detail-inner"></div>
      </details>

    </main>
  </div>

  <script src="js/utils.js?v=10"></script>
  <script src="js/data.js?v=21"></script>
  <script src="js/modals.js?v=13"></script>
  <script src="js/nav.js?v=10"></script>
  <script src="js/pages/facturation.js?v=8"></script>
</body>
</html>
