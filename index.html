<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord — Emploi du temps</title>
  <link rel="stylesheet" href="css/style.css?v=202606051436">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Planning">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</head>
<body>
  <aside id="sidebar"></aside>
  <div id="app-main">
    <main id="main-content">

      <div class="page-header">
        <h1 class="page-title">Tableau de bord</h1>
        <div class="page-actions">
          <button class="btn btn-ghost" onclick="window._showInvoiceExport()">📋 Préparer une facture</button>
          <button class="btn btn-ghost" onclick="window._showPlanningExport()">📄 Planning mensuel</button>
          <a class="btn btn-primary" href="calendrier.html">📅 Aller au calendrier</a>
        </div>
      </div>

      <!-- Switch pôle + KPIs -->
      <div style="margin-bottom:20px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
          <span style="font-size:0.82rem;color:var(--text-muted)">Afficher :</span>
          <div id="pole-switch" style="display:flex;gap:4px;background:var(--surface);border-radius:20px;padding:3px"></div>
        </div>
        <div class="kpi-grid" id="kpi-grid"></div>
      </div>

      <!-- Aperçu par écoles et étudiants (collapsible) -->
      <details class="fin-section" style="margin-bottom:20px" open>
        <summary style="display:flex;justify-content:space-between;align-items:center">
          <span>Aperçu par écoles et étudiants</span>
          <a class="btn-link" href="ecoles.html" onclick="event.stopPropagation()">Gérer →</a>
        </summary>
        <div style="padding:0 18px 18px">
          <div class="dashboard-companies-grid" id="companies-overview">
            <p class="empty-state">Chargement…</p>
          </div>
        </div>
      </details>

      <!-- Prochaines missions + alertes -->
      <div class="dashboard-grid">
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Prochaines missions</h2>
            <a class="btn-link" href="calendrier.html">Voir le calendrier →</a>
          </div>
          <div class="card-body" id="upcoming-courses">
            <p class="empty-state">Chargement…</p>
          </div>
        </div>
        <div class="alerts-column">
          <div id="alert-memos"></div>
          <div id="alert-conflicts"></div>
          <div id="alert-reschedule"></div>
          <div id="alert-unpaid"></div>
        </div>
      </div>

      <div class="card" style="margin-top:20px">
        <div class="card-header">
          <h2 class="card-title">Formations en cours</h2>
          <a class="btn-link" href="formations.html">Voir toutes →</a>
        </div>
        <div class="card-body" id="active-formations">
          <p class="empty-state">Chargement…</p>
        </div>
      </div>

    </main>
  </div>

  <script src="js/utils.js?v=202606051436"></script>
  <script src="js/data.js?v=202606051436"></script>
  <script src="js/modals.js?v=202606051436"></script>
  <script src="js/nav.js?v=202606051436"></script>
  <script src="js/pages/dashboard.js?v=202606051436"></script>
</body>
</html>
