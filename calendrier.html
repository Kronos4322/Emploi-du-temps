<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendrier — Emploi du temps</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Planning">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</head>
<body>

  <aside id="sidebar"></aside>

  <div id="app-main">
    <main id="main-content">

      <div class="page-header">
        <h1 class="page-title">Calendrier</h1>
        <div class="page-actions">
          <button class="btn btn-primary" id="btn-new-course">+ Nouveau cours</button>
        </div>
      </div>

      <!-- Filtres -->
      <div class="calendar-filters" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;padding:10px 16px;background:var(--bg-card);border-radius:var(--radius);border:1px solid var(--border)">
        <span class="filter-label" style="font-size:0.8rem;color:var(--text-muted)">Sociétés :</span>
        <div id="filter-poles" style="display:flex;gap:4px;flex-wrap:wrap"></div>
        <span class="filter-label" style="font-size:0.8rem;color:var(--text-muted);margin-left:8px">Prestataires :</span>
        <div id="filter-providers-wrap" style="position:relative">
          <button id="btn-filter-prov" class="btn btn-ghost btn-sm" onclick="window._toggleMenu('cal-prov-menu')">Tous ▼</button>
          <div id="cal-prov-menu" style="display:none;position:absolute;top:100%;left:0;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-md);z-index:50;min-width:200px;max-height:220px;overflow-y:auto;padding:6px"></div>
        </div>
        <span class="filter-label" style="font-size:0.8rem;color:var(--text-muted);margin-left:8px">Étudiants :</span>
        <div id="filter-students-wrap" style="position:relative">
          <button id="btn-filter-stud" class="btn btn-ghost btn-sm" onclick="window._toggleMenu('cal-stud-menu')">Tous ▼</button>
          <div id="cal-stud-menu" style="display:none;position:absolute;top:100%;left:0;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-md);z-index:50;min-width:200px;max-height:220px;overflow-y:auto;padding:6px"></div>
        </div>
        <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="window._calReset()">✕ Réinitialiser</button>
      </div>

      <!-- Barre de navigation du calendrier -->
      <div class="calendar-toolbar">
        <div class="cal-nav">
          <button class="btn btn-ghost btn-icon" id="cal-prev" title="Précédent">‹</button>
          <button class="btn btn-ghost btn-today" id="cal-today">Aujourd'hui</button>
          <button class="btn btn-ghost btn-icon" id="cal-next" title="Suivant">›</button>
        </div>
        <div class="cal-title" id="cal-title">—</div>
        <div class="cal-view-switcher">
          <button class="btn btn-ghost" id="view-day"   data-view="day">Jour</button>
          <button class="btn btn-primary" id="view-week" data-view="week">Semaine</button>
          <button class="btn btn-ghost" id="view-month" data-view="month">Mois</button>
        </div>
      </div>

      <!-- Corps du calendrier (rendu par JS) -->
      <div id="calendar-body"></div>

    </main>
  </div>

  <script src="js/utils.js?v=10"></script>
  <script src="js/data.js?v=10"></script>
  <script src="js/modals.js?v=10"></script>
  <script src="js/nav.js?v=10"></script>
  <script src="js/pages/calendrier.js?v=3"></script>

</body>
</html>
