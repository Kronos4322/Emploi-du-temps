<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendrier — Emploi du temps</title>
  <link rel="stylesheet" href="css/style.css?v=202607021553">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Planning">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</head>
<body>

  <aside id="sidebar"></aside>

  <div id="app-main">
    <main id="main-content">

      <div class="page-header">
        <h1 class="page-title">Calendrier</h1>
        <div class="page-actions">
          <button class="btn btn-ghost" id="btn-new-personal" style="border-color:#a78bfa;color:#7c3aed">🧑 + Personnel</button>
          <button class="btn btn-primary" id="btn-new-course">+ Nouvelle mission</button>
        </div>
      </div>

      <!-- Filtres -->
      <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
        <div style="position:relative">
          <button id="btn-filter-pole" class="btn btn-ghost btn-sm" onclick="window._calToggle('cal-pole-menu')">🏛 Pôles <span id="lbl-pole">Tous</span> ▼</button>
          <div id="cal-pole-menu" style="display:none;position:absolute;top:100%;left:0;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-md);z-index:50;min-width:200px;max-height:280px;overflow-y:auto;padding:6px">
            <div style="display:flex;gap:4px;padding:4px 2px 8px;border-bottom:1px solid var(--border);margin-bottom:4px">
              <button class="btn btn-xs btn-ghost" onclick="window._calSelectAllPole()">Tout</button>
              <button class="btn btn-xs btn-ghost" onclick="window._calSelectNonePole()">Aucun</button>
            </div>
            <div id="cal-pole-list"></div>
          </div>
        </div>
        <div style="position:relative">
          <button id="btn-filter-co" class="btn btn-ghost btn-sm" onclick="window._calToggle('cal-co-menu')">🏢 Écoles <span id="lbl-co">Toutes</span> ▼</button>
          <div id="cal-co-menu" style="display:none;position:absolute;top:100%;left:0;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-md);z-index:50;min-width:220px;max-height:280px;overflow-y:auto;padding:6px">
            <div style="display:flex;gap:4px;padding:4px 2px 8px;border-bottom:1px solid var(--border);margin-bottom:4px">
              <button class="btn btn-xs btn-ghost" onclick="window._calSelectAllCo()">Tout</button>
              <button class="btn btn-xs btn-ghost" onclick="window._calSelectNoneCo()">Aucun</button>
            </div>
            <div id="cal-co-list"></div>
          </div>
        </div>
        <div style="position:relative">
          <button id="btn-filter-prov" class="btn btn-ghost btn-sm" onclick="window._calToggle('cal-prov-menu')">👤 Prestataires <span id="lbl-prov">Tous</span> ▼</button>
          <div id="cal-prov-menu" style="display:none;position:absolute;top:100%;left:0;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-md);z-index:50;min-width:220px;max-height:280px;overflow-y:auto;padding:6px">
            <div style="display:flex;gap:4px;padding:4px 2px 8px;border-bottom:1px solid var(--border);margin-bottom:4px">
              <button class="btn btn-xs btn-ghost" onclick="window._calSelectAllProv()">Tout</button>
              <button class="btn btn-xs btn-ghost" onclick="window._calSelectNoneProv()">Aucun</button>
            </div>
            <div id="cal-prov-list"></div>
          </div>
        </div>
        <div style="position:relative">
          <button id="btn-filter-stud" class="btn btn-ghost btn-sm" onclick="window._calToggle('cal-stud-menu')">🎓 Étudiants <span id="lbl-stud">Tous</span> ▼</button>
          <div id="cal-stud-menu" style="display:none;position:absolute;top:100%;left:0;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-md);z-index:50;min-width:220px;max-height:280px;overflow-y:auto;padding:6px">
            <div style="display:flex;gap:4px;padding:4px 2px 8px;border-bottom:1px solid var(--border);margin-bottom:4px">
              <button class="btn btn-xs btn-ghost" onclick="window._calSelectAllStud()">Tout</button>
              <button class="btn btn-xs btn-ghost" onclick="window._calSelectNoneStud()">Aucun</button>
            </div>
            <div id="cal-stud-list"></div>
          </div>
        </div>
        <button id="btn-filter-personal" class="btn btn-ghost btn-sm" onclick="window._calTogglePersonal()" style="border-color:#a78bfa;color:#7c3aed">🧑 Personnel <span id="lbl-personal">✔</span></button>
        <button class="btn btn-ghost btn-sm" onclick="window._calReset()">✕ Tout réinitialiser</button>
      </div>

      <!-- Barre de navigation du calendrier -->
      <div class="calendar-toolbar">
        <div class="cal-nav">
          <button class="btn btn-ghost btn-icon" id="cal-prev" title="Précédent">‹</button>
          <button class="btn btn-ghost btn-today" id="cal-today">Aujourd'hui</button>
          <button class="btn btn-ghost btn-icon" id="cal-next" title="Suivant">›</button>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <div class="cal-title" id="cal-title">—</div>
          <div id="cal-revenue" style="font-size:0.85rem;font-weight:600;color:#8b5cf6;background:#8b5cf615;border:1px solid #8b5cf630;border-radius:20px;padding:3px 12px;white-space:nowrap"></div>
        </div>
        <div class="cal-view-switcher">
          <button class="btn btn-ghost" id="view-day"   data-view="day">Jour</button>
          <button class="btn btn-primary" id="view-week" data-view="week">Semaine</button>
          <button class="btn btn-ghost" id="view-month" data-view="month">Mois</button>
        </div>
      </div>

      <!-- Corps du calendrier (rendu par JS) -->
      <div id="calendar-body"></div>

    </main>
  </div>

  <script src="js/utils.js?v=202607021553"></script>
  <script src="js/data.js?v=202607021553"></script>
  <script src="js/modals.js?v=202607021553"></script>
  <script src="js/nav.js?v=202607021553"></script>
  <script src="js/pages/calendrier.js?v=202607021553"></script>

</body>
</html>
