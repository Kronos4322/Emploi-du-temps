<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Missions — Emploi du temps</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Planning">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</head>
<body>

  <aside id="sidebar"></aside>

  <div id="app-main">
    <main id="main-content">

      <div class="page-header">
        <h1 class="page-title">Missions</h1>
        <div class="page-actions">
          <button class="btn btn-primary" id="btn-new-course">+ Nouvelle mission</button>
        </div>
      </div>

      <!-- Filtres -->
      <div class="filters-bar">
        <input type="text" id="filter-search" class="form-input filter-search" placeholder="🔍 Rechercher…">
        <select id="filter-month"    class="form-input filter-select"></select>
        <select id="filter-company"  class="form-input filter-select"></select>
        <select id="filter-provider" class="form-input filter-select"></select>
        <select id="filter-mtype"    class="form-input filter-select"></select>
        <select id="filter-status"   class="form-input filter-select">
          <option value="">Tous les statuts</option>
          <option value="planned">Prévu</option>
          <option value="done">Réalisé</option>
          <option value="cancelled">Annulé</option>
          <option value="postponed">Reporté</option>
          <option value="moved">Déplacé</option>
        </select>
        <select id="filter-payment" class="form-input filter-select">
          <option value="">Tous paiements</option>
          <option value="unpaid">Non payé</option>
          <option value="invoiced">Facturé</option>
          <option value="paid">Payé</option>
        </select>
        <button class="btn btn-ghost" id="btn-reset-filters">Réinitialiser</button>
      </div>

      <!-- Résumé -->
      <div class="list-summary" id="list-summary">—</div>

      <!-- Tableau -->
      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Titre</th>
              <th>Type</th>
              <th>Société</th>
              <th>Horaires</th>
              <th>Durée</th>
              <th>Statut</th>
              <th>Paiement</th>
              <th class="cell-money">Revenu</th>
              <th>Prestataire</th>
              <th class="cell-money">Coût</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="courses-tbody">
            <tr><td colspan="12" class="empty-state-cell">Chargement…</td></tr>
          </tbody>
        </table>
      </div>

    </main>
  </div>

  <script src="js/utils.js?v=10"></script>
  <script src="js/data.js?v=20"></script>
  <script src="js/modals.js?v=13"></script>
  <script src="js/nav.js?v=10"></script>
  <script src="js/pages/cours.js?v=2"></script>

</body>
</html>
