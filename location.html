<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location — Emploi du temps</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Planning">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</head>
<body>
  <aside id="sidebar"></aside>

  <div id="app-main">
    <main id="main-content">

      <div class="page-header">
        <h1 class="page-title">🏠 Location</h1>
        <div class="page-actions">
          <button class="btn btn-ghost" id="btn-add-property">+ Ajouter un bien</button>
          <button class="btn btn-primary" id="btn-add-income">+ Ajouter un revenu</button>
        </div>
      </div>

      <!-- Filtres -->
      <div class="filters-bar" style="gap:8px;flex-wrap:wrap;margin-bottom:16px">
        <select id="loc-filter-month" class="form-input filter-select"></select>
        <select id="loc-filter-property" class="form-input filter-select">
          <option value="">Tous les biens</option>
        </select>
      </div>

      <!-- KPIs -->
      <div class="kpi-grid" id="loc-kpis" style="margin-bottom:20px">
        <div class="kpi-card kpi-large">
          <div class="kpi-icon kpi-green">💶</div>
          <div class="kpi-content">
            <div class="kpi-value" id="loc-kpi-total">—</div>
            <div class="kpi-label">Revenus du mois</div>
          </div>
        </div>
        <div class="kpi-card kpi-large">
          <div class="kpi-icon kpi-teal">📅</div>
          <div class="kpi-content">
            <div class="kpi-value" id="loc-kpi-year">—</div>
            <div class="kpi-label">Revenus 12 derniers mois</div>
          </div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon kpi-blue">🏘</div>
          <div class="kpi-content">
            <div class="kpi-value" id="loc-kpi-props">—</div>
            <div class="kpi-label">Biens actifs</div>
          </div>
        </div>
        <div class="kpi-card" id="loc-kpi-pending-card">
          <div class="kpi-icon kpi-orange">⏳</div>
          <div class="kpi-content">
            <div class="kpi-value" id="loc-kpi-pending">—</div>
            <div class="kpi-label">En attente de réception</div>
          </div>
        </div>
      </div>

      <!-- Mes biens -->
      <details class="fin-section" open id="section-properties">
        <summary>Mes biens</summary>
        <div class="properties-grid" id="properties-list">
          <div class="empty-state" style="grid-column:1/-1">
            <p>Aucun bien enregistré. Cliquez sur "+ Ajouter un bien" pour commencer.</p>
          </div>
        </div>
      </details>

      <!-- Revenus du mois -->
      <details class="fin-section" open>
        <summary>Revenus — <span id="loc-month-label">—</span></summary>
        <div class="report-table-wrapper">
          <table class="data-table">
            <thead><tr>
              <th>Bien</th>
              <th>Plateforme</th>
              <th class="cell-center">Nuits louées</th>
              <th class="cell-money">Montant</th>
              <th>Statut</th>
              <th>Notes</th>
              <th class="cell-center">Actions</th>
            </tr></thead>
            <tbody id="incomes-tbody"></tbody>
            <tfoot><tr class="table-total">
              <td colspan="3"><strong>Total</strong></td>
              <td class="cell-money" id="incomes-total"><strong>—</strong></td>
              <td colspan="3"></td>
            </tr></tfoot>
          </table>
        </div>
      </details>

    </main>
  </div>

  <!-- Overlay commun -->
  <div id="loc-overlay" class="loc-drawer-overlay"></div>

  <!-- Drawer : Ajouter / modifier un bien -->
  <div id="property-drawer" class="loc-drawer">
    <div class="loc-drawer-title">
      <span id="property-drawer-title">Nouveau bien</span>
      <button class="loc-drawer-close" onclick="window._locCloseDrawers()">✕</button>
    </div>
    <form id="property-form" onsubmit="window._locSaveProperty(event)">
      <div class="form-group">
        <label class="form-label">Nom du bien *</label>
        <input type="text" id="prop-name" class="form-input" placeholder="Ex : Appartement Marrakech Centre" required>
      </div>
      <div class="form-group">
        <label class="form-label">Adresse / localisation</label>
        <input type="text" id="prop-address" class="form-input" placeholder="Ex : Médina, Marrakech, Maroc">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Type</label>
          <select id="prop-type" class="form-input">
            <option value="airbnb">Airbnb</option>
            <option value="booking">Booking</option>
            <option value="long-term">Location longue durée</option>
            <option value="seasonal">Saisonnier</option>
            <option value="other">Autre</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Couleur</label>
          <input type="color" id="prop-color" class="form-input" value="#f97316" style="height:38px;padding:2px 4px;cursor:pointer">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Notes</label>
        <textarea id="prop-notes" class="form-input" rows="3" placeholder="Informations complémentaires…"></textarea>
      </div>
      <div class="form-group">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:0.9rem">
          <input type="checkbox" id="prop-active" checked>
          Bien actif
        </label>
      </div>
      <input type="hidden" id="prop-id">
      <div style="display:flex;gap:10px;margin-top:20px">
        <button type="submit" class="btn btn-primary" style="flex:1">Enregistrer</button>
        <button type="button" class="btn btn-ghost" onclick="window._locCloseDrawers()">Annuler</button>
      </div>
    </form>
  </div>

  <!-- Drawer : Ajouter / modifier un revenu -->
  <div id="income-drawer" class="loc-drawer">
    <div class="loc-drawer-title">
      <span id="income-drawer-title">Nouveau revenu</span>
      <button class="loc-drawer-close" onclick="window._locCloseDrawers()">✕</button>
    </div>
    <form id="income-form" onsubmit="window._locSaveIncome(event)">
      <div class="form-group">
        <label class="form-label">Bien *</label>
        <select id="inc-property" class="form-input" required></select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Mois *</label>
          <input type="month" id="inc-month" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">Montant (€) *</label>
          <input type="number" id="inc-amount" class="form-input" min="0" step="0.01" required placeholder="0.00">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Plateforme</label>
          <input type="text" id="inc-platform" class="form-input" placeholder="Ex : Airbnb, Booking…" list="platform-list">
          <datalist id="platform-list">
            <option value="Airbnb">
            <option value="Booking.com">
            <option value="Vrbo">
            <option value="Abritel">
            <option value="Direct">
            <option value="Autre">
          </datalist>
        </div>
        <div class="form-group">
          <label class="form-label">Nuits louées</label>
          <input type="number" id="inc-nights" class="form-input" min="0" step="1" placeholder="0">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Statut</label>
        <select id="inc-status" class="form-input">
          <option value="received">Reçu</option>
          <option value="pending">En attente</option>
          <option value="partial">Partiel</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Notes</label>
        <textarea id="inc-notes" class="form-input" rows="2" placeholder="Remarques…"></textarea>
      </div>
      <input type="hidden" id="inc-id">
      <div style="display:flex;gap:10px;margin-top:20px">
        <button type="submit" class="btn btn-primary" style="flex:1">Enregistrer</button>
        <button type="button" class="btn btn-ghost" onclick="window._locCloseDrawers()">Annuler</button>
      </div>
    </form>
  </div>

  <script src="js/utils.js?v=10"></script>
  <script src="js/data.js?v=12"></script>
  <script src="js/modals.js?v=12"></script>
  <script src="js/nav.js?v=10"></script>
  <script src="js/pages/location.js?v=1"></script>
</body>
</html>
